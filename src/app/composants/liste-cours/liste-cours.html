<section class="liste-cours">
    @for(c of cours;track c.titre )
    {
        <article class="carte-cours" [class.atif]="c === coursActif" (click)="selectionner(c)">
            <h2> {{c.titre}} </h2>
            <p>
                Duree:{{c.duree}}
            </p>
            <p>
                places:{{c.places}}
            </p>
            <p>
                Categorie:{{c.categorie}}
            </p>
        </article>
    }
</section>
